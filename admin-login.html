<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mist Admin · Hyrja</title>
<link rel="icon" href="img/monogram.svg" type="image/svg+xml">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#0a0812;font-family:'Jost',system-ui,sans-serif;
    background-image:radial-gradient(ellipse at 50% 0%,#1a0f2e 0%,#0a0812 70%);
  }
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500&display=swap');

  .card{
    width:100%;max-width:400px;padding:48px 40px;
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:16px;
    backdrop-filter:blur(20px);
    text-align:center;
  }
  .logo{
    font-family:'Cormorant Garamond',serif;
    font-size:28px;font-weight:500;letter-spacing:0.08em;
    color:#f5f0e8;margin-bottom:6px;
  }
  .sub{color:rgba(255,255,255,0.35);font-size:12px;letter-spacing:0.12em;text-transform:uppercase;margin-bottom:40px}
  label{display:block;text-align:left;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:rgba(255,255,255,0.4);margin-bottom:8px}
  input{
    width:100%;padding:14px 18px;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:8px;color:#f5f0e8;font-size:22px;letter-spacing:0.3em;
    text-align:center;outline:none;font-family:inherit;
    transition:border-color .2s;
  }
  input:focus{border-color:rgba(201,162,106,0.6)}
  .err{
    margin-top:12px;font-size:13px;color:#e57373;
    min-height:20px;opacity:0;transition:opacity .2s;
  }
  .err.show{opacity:1}
  button{
    margin-top:28px;width:100%;padding:14px;
    background:linear-gradient(135deg,#c9a26a,#a67c45);
    border:none;border-radius:8px;cursor:pointer;
    font-family:inherit;font-size:13px;letter-spacing:0.14em;text-transform:uppercase;
    color:#0a0812;font-weight:500;
    transition:opacity .2s,transform .1s;
  }
  button:hover{opacity:.9}
  button:active{transform:scale(.98)}
  .shake{animation:shake .4s ease}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
</style>
</head>
<body>
<div class="card">
  <div class="logo">Mist</div>
  <div class="sub">Admin Dashboard</div>
  <label for="code">Kodi i hyrjes</label>
  <input id="code" type="password" inputmode="numeric" maxlength="6" placeholder="······" autocomplete="off">
  <div class="err" id="err">Kodi është i gabuar. Provo përsëri.</div>
  <button id="btn" onclick="tryLogin()">Hyr</button>
</div>
<script>
  // Auto-redirect if already logged in
  try { if(localStorage.getItem('mist_admin_auth')==='1') location.replace('admin.html'); } catch(e){}

  const inp = document.getElementById('code');
  inp.addEventListener('keydown', e => { if(e.key==='Enter') tryLogin(); });

  function tryLogin(){
    const v = inp.value.trim();
    if(v === '411748'){
      try{ localStorage.setItem('mist_admin_auth','1'); }catch(e){}
      location.replace('admin.html');
    } else {
      document.getElementById('err').classList.add('show');
      inp.classList.add('shake');
      inp.value='';
      setTimeout(()=>inp.classList.remove('shake'),500);
    }
  }
</script>
</body>
</html>
