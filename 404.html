<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<script>
  // /adminE, /admine, /Admin … → the admin panel (addresses are case-sensitive on the host)
  if (/^\/admin/i.test(location.pathname)) location.replace("/admin/" + location.hash);
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Faqja nuk u gjet · Mist Fragrance House</title>
<link rel="icon" href="/img/monogram.svg" type="image/svg+xml">
<style>
  :root{--bg:#FAF7F0;--ink:#1A1238;--ink-3:rgba(26,18,56,.42)}
  @media (prefers-color-scheme:dark){:root{--bg:#0F0B22;--ink:#F2EDE0;--ink-3:rgba(242,237,224,.42)}}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:400 15px/1.5 "Jost",system-ui,sans-serif;text-align:center;padding:24px}
  h1{font:500 40px/1.1 "Cormorant Garamond",Georgia,serif;margin:0 0 8px}
  p{color:var(--ink-3);margin:0 0 24px}
  a{display:inline-block;padding:14px 26px;border-radius:999px;background:var(--ink);color:var(--bg);text-decoration:none;font-size:13px;letter-spacing:.12em;text-transform:uppercase}
</style>
</head>
<body>
  <div>
    <h1>Faqja nuk u gjet</h1>
    <p>Kjo adresë nuk ekziston.</p>
    <a href="/">Kthehu te dyqani</a>
  </div>
</body>
</html>
